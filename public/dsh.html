<style>
  body { margin: 0; min-height: 100vh; background: #12161f; color: #cfe0f5; font: 14px/1.7 system-ui, "Segoe UI", sans-serif; }
  .box { max-width: 640px; margin: 0 auto; padding: 40px 20px; }

<!-- 这一页模拟 DSH 宿主：只往页面里塞一行脚本，剩下的都该由挂件自己完成。 -->
<div class="box">
  <h1>模拟 DSH 注入</h1>
  <p class="note">这一页不含任何挂件代码，只有下面这一行 <code>&lt;script type="module" src="/dsh-whale/widget.js"&gt;</code> —— 与 DSH 注入插件脚本的方式一致。鲸鱼娘应当自己出现在右下角、自己取 <code>/dsh-whale/balance.json</code>。</p>
</div>
<script type="module" src="/dsh-whale/widget.js"></script>
